name: Feature request
description: Propose a behavior or capability for watx.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the behavior that would address the use case.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and alternatives
      description: Mention relevant MVP constraints or alternatives you considered.
    validations:
      required: false
